# laravel 部署
server {
    listen 8001;
    listen [::]:8001;

    root /application/2026/public;

    index   index.php;
    charset utf-8;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }
    location /phpfpm {
        # #$document_root 的参数是由root行定义
        fastcgi_pass   php8.5-fpm:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $fastcgi_script_name;
    }

    location ~ \.php$ {
        fastcgi_pass        php8.5-fpm:9000;
        fastcgi_param       SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include             fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }
}
# npm 前端
server {
    listen      80;
    listen      [::]:80;
    server_name *.localhost;
    root        /application/2026/adminer/dist;
    index       index.html;
    charset     utf-8;
    location / {
        try_files $uri $uri/ /index.html;
    }
    location ~ ^/(admin|api|plugin|telescope|pulse|horizon) {
        proxy_pass       http://127.0.0.1:8001;
        proxy_set_header Host                  $host;
        proxy_set_header X-Real-IP             $remote_addr;
        proxy_set_header X-Forwarded-For       $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto     $scheme;
    }
    # 配置 图片访问
    location /storage/ {
        proxy_pass       http://127.0.0.1:8001;  # 确保后端存储路径正确
        proxy_set_header Host                  $host;
        proxy_set_header X-Real-IP             $remote_addr;
        proxy_set_header X-Forwarded-For       $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto     $scheme;
        add_header       Cache-Control         "public, max-age=86400";
    }
    # 配置 图片访问
    location /tenancy/ {
        proxy_pass       http://127.0.0.1:8001;  # 确保后端存储路径正确
        proxy_set_header Host                  $host;
        proxy_set_header X-Real-IP             $remote_addr;
        proxy_set_header X-Forwarded-For       $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto     $scheme;
        add_header       Cache-Control         "public, max-age=86400";
    }
}
# Hyperf 配置
server {
    listen 80;
    listen [::]:80;

    server_name h.localhost;

    # Hyperf 是常驻内存的，通常不需要在 Nginx 层指定 root 目录，
    # 除非你需要 Nginx 直接处理静态资源。
    # root /application/sulianapp/public;

    index   index.php;
    charset utf-8;

    location / {
        # 核心修改：使用 proxy_pass 转发请求
        # 这里的 hyperf_app 是你 docker-compose 中的服务名或容器名
        proxy_pass http://php8.5-fpm:9501;

        # 设置请求头，确保 Hyperf 能获取到真实的客户端 IP 和域名
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 支持 WebSocket 配置（如果 Hyperf 开启了 WebSocket 服务）
        # proxy_http_version 1.1;
        # proxy_set_header Upgrade $http_upgrade;
        # proxy_set_header Connection $connection_upgrade;
    }
}
# laravel octane
server {
    listen        80;
    listen        [::]:80;
    server_tokens off;
    server_name   c.localhost;


    root /application/2026/public;

    charset utf-8;

    location ~ \.php$ {
        return 404;
    }

    location / {
        try_files $uri @octane;
    }

    location = /favicon.ico {
        access_log    off;
        log_not_found off;
    }
    location = /robots.txt {
        access_log    off;
        log_not_found off;
    }

    access_log off;
    error_log  /var/log/nginx/domain.com-error.log error;

    error_page 404 /index.php;

    location @octane {
        proxy_pass         http://php8.5-fpm:8010;
        proxy_http_version 1.1;
        proxy_set_header   Host                   $http_host;
        proxy_set_header   Scheme                 $scheme;
        proxy_set_header   SERVER_PORT            $server_port;
        proxy_set_header   REMOTE_ADDR            $remote_addr;
        proxy_set_header   X-Forwarded-For        $proxy_add_x_forwarded_for;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
    # 配置 图片访问
    location /storage/ {
        proxy_pass       http://127.0.0.1:8001;  # 确保后端存储路径正确
        proxy_set_header Host                  $host;
        proxy_set_header X-Real-IP             $remote_addr;
        proxy_set_header X-Forwarded-For       $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto     $scheme;
        add_header       Cache-Control         "public, max-age=86400";
    }
}
