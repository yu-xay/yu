server {
    listen 80;
    listen [::]:80;
    server_name drupal.localhost;
    root /application/drupal;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    index index.php;

    charset utf-8;

    client_max_body_size 128M;  # 新增：允许上传大文件（Drupal 后台必备）

    # 静态文件缓存（提升性能）
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff|woff2|ttf|svg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;
    error_page 500 502 503 504 /index.php;

    location ~ \.php$ {
        fastcgi_pass   php8.4-fpm:9000;  # 你的这个是对的（Docker 环境）
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 300;  # 新增：防止长任务超时（如安装模块）
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    # 新增：Drupal 安全（禁止访问敏感文件）
    location ~ ^/sites/.*/private/ { deny all; }
    location ~ ^/sites/.*/files/.*\.php$ { deny all; }
}